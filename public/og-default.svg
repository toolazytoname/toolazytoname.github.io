<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent-bar)"/>

  <text x="80" y="130" font-family="-apple-system, SF Mono, monospace" font-size="20" fill="#0ea5e9" letter-spacing="2">
    lazy · weichao.ren
  </text>
  <text x="80" y="280" font-family="Georgia, serif" font-weight="500" font-size="72" fill="#fafafa" letter-spacing="-1">
    Ex-big-tech infra engineer
  </text>
  <text x="80" y="370" font-family="Georgia, serif" font-weight="500" font-size="72" fill="#fafafa" letter-spacing="-1">
    indie dev · ski · climb · dive
  </text>
  <text x="80" y="440" font-family="-apple-system, SF Pro Text, sans-serif" font-size="24" fill="#a3a3a3">
    Swift / LLVM / TypeScript / AI · 用 AI 造自己想要的工具
  </text>

  <!-- Terminal prompt decoration -->
  <rect x="80" y="480" width="640" height="80" rx="12" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
  <circle cx="104" cy="504" r="6" fill="#ff5f57"/>
  <circle cx="124" cy="504" r="6" fill="#febc2e"/>
  <circle cx="144" cy="504" r="6" fill="#28c840"/>
  <text x="80" y="545" font-family="SF Mono, monospace" font-size="18" fill="#0ea5e9">$</text>
  <text x="104" y="545" font-family="SF Mono, monospace" font-size="18" fill="#fafafa">whoami</text>
